name: release

on:
  push:
    branches: [master]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check VERSION against existing tags
        id: version
        run: |
          tag="v$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git tag -l "$tag" | grep -qx "$tag"; then
            echo "$tag already exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.version.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: actions/setup-go@v7
        if: steps.version.outputs.exists != 'true'
        with:
          go-version-file: go.mod

      # dockers_v2 needs a builder that supports multi-platform builds - see
      # https://goreleaser.com/customization/package/dockers_v2/
      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.exists != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.exists != 'true'

      - name: Log in to GHCR
        if: steps.version.outputs.exists != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run GoReleaser
        if: steps.version.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
